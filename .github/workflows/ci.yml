name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: E2E (demo script on the production build)
        run: |
          pnpm start &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/sign-in && break; sleep 2; done
          E2E_BASE_URL=http://localhost:3000 pnpm test:e2e
        env:
          AUTH_SECRET: ci-only-secret-ci-only-secret-0000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
